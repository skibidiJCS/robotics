<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeeedd"><meta name="description" content="Le village interactif de l’équipe de robotique de Sainte-Anne."><title>Le village — Sainte-Anne robotique</title><link rel="icon" href="/village/hat.svg" type="image/svg+xml"><link rel="stylesheet" href="/village/style.css"><script type="module" src="/village/game.js"></script></head>
<body>
<main id="village" aria-label="Le village"><canvas id="world" tabindex="0" aria-label="Déplacez-vous avec les flèches, sautez avec Espace et entrez dans une maison avec E."></canvas><div id="doors"></div><button id="map-sign" aria-label="Ouvrir la carte"><svg viewBox="0 0 32 26" aria-hidden="true"><path d="m2 6 9-3 10 4 9-4v18l-9 3-10-4-9 3Z"/><path d="M11 3v17M21 7v17"/></svg></button><button id="nearby" hidden><kbd>E</kbd><span></span></button><button id="speed" aria-pressed="false" aria-label="Courir, vitesse deux fois plus rapide">×1</button><div id="touch-controls" aria-label="Déplacement"><button id="joystick" aria-label="Glissez pour marcher" aria-describedby="joystick-help"><span aria-hidden="true"></span></button><span id="joystick-help" hidden>Glissez le bouton vers la gauche ou la droite et maintenez pour marcher.</span><button id="touch-jump">Sauter</button></div><div id="first-hint" role="status"></div><div id="pickup" role="status"></div></main>
<section id="room" hidden aria-labelledby="room-title"><button id="leave-room" class="exit-door"><svg viewBox="0 0 25 30" aria-hidden="true"><path d="M4 27V3h17v24M1 27h23M8 3v24l10-3V6Z"/><path d="M14 15h1"/></svg><span>Au village</span></button><button id="room-map" class="room-map" aria-label="Ouvrir la carte"><svg viewBox="0 0 32 26" aria-hidden="true"><path d="m2 6 9-3 10 4 9-4v18l-9 3-10-4-9 3Z"/><path d="M11 3v17M21 7v17"/></svg></button><div id="room-content"></div></section>
<dialog id="map" aria-labelledby="map-title"><button id="close-map" class="close" aria-label="Fermer">×</button><h2 id="map-title">Le village</h2><nav id="map-links" aria-label="Les maisons"></nav><div class="map-options"><button id="locale" aria-label="Switch to English">EN</button><button id="reset-berries">Recommencer la récolte</button></div></dialog>
<div id="iris" aria-hidden="true"></div>
<noscript>Activez JavaScript pour visiter le village. / Enable JavaScript to visit the village.</noscript>
</body></html>
